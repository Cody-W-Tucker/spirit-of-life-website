# Dependabot configuration for Spirit of Life Church Website
# Security and critical vulnerability updates only.
# This is a stable site; no routine minor/patch version bumps.

version: 2
updates:
  # npm: security updates only.
  # Regular version updates are disabled (open-pull-requests-limit: 0).
  # GitHub security updates (when enabled in repo settings) will still create PRs for vulns.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # ignored for version updates when limit is 0
    open-pull-requests-limit: 0
    reviewers:
      - "Cody-W-Tucker"
    assignees:
      - "Cody-W-Tucker"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "security"

  # GitHub Actions: minimal (security + occasional CI maintenance only)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Cody-W-Tucker"
    assignees:
      - "Cody-W-Tucker"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
