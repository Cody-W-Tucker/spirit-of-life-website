name: Dependabot Auto-Merge

# Security updates only (see dependabot.yml: open-pull-requests-limit: 0 for npm).
# Auto-merge + approve only for security-labeled patch updates.
# Vercel build acts as the gate — auto-merge waits for required status checks.

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for security patch updates
        if: |
          contains(github.event.pull_request.labels.*.name, 'security') &&
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Dependabot security patch PRs
        if: |
          contains(github.event.pull_request.labels.*.name, 'security') &&
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_APPROVAL_TOKEN }}
